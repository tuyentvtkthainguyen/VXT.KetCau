name: Build Windows installer
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy matplotlib flask python-docx python-pptx reportlab pillow pytest
      - run: python -m pytest tests -q
  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run tests on Windows
        run: python -m pytest tests -q
      - name: Build app
        run: pyinstaller vxtgiai.spec --noconfirm
      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\VXTGiaiKetCau\VXTGiaiKetCau.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: VXTGiaiKetCau-Setup
          path: dist-installer/*.exe
      - name: Publish on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*.exe
