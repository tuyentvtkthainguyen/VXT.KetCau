name: Build & Test

permissions:
  contents: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Lõi + kiểm thử
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Kiểm thử lõi
        env:
          VXT_SAMPLE_DIR: ${{ github.workspace }}/ho-so-mau
        run: dotnet test tests/VXT.KetCau.Core.Tests -c Release --logger "trx;LogFileName=ketqua.trx" --logger "console;verbosity=normal" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ho-so-mau
          path: ho-so-mau
      - name: Đăng hồ sơ mẫu lên bản thử (nhánh phát triển)
        if: always() && github.ref_name == 'autocad-trien-khai-ho-so'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "autocad-ho-so-thu"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --prerelease --target $env:GITHUB_SHA --title "VXT hồ sơ AutoCAD – bản thử" --notes "Bản thử từ nhánh autocad-trien-khai-ho-so." }
          Compress-Archive -Path ho-so-mau\* -DestinationPath ho-so-mau.zip -Force
          gh release upload $tag ho-so-mau.zip --clobber
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ket-qua-kiem-thu
          path: TestResults

  revit:
    name: Add-in Revit ${{ matrix.rv }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rv: [R22, R23, R24, R25, R26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # CSiAPIv1.dll có bản quyền CSI → CI dùng thư viện giả lập chữ ký chỉ để biên dịch
      - name: Thư viện giả lập CSiAPIv1
        run: dotnet build ci/CsiStub -c Release -o ci/CsiStub/out
      - name: Build add-in
        run: dotnet build src/VXT.KetCau.Revit -c "Release ${{ matrix.rv }}" -p:CsiApiDir="${{ github.workspace }}\ci\CsiStub\out"

  cli:
    name: Dòng lệnh vxtkc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build ci/CsiStub -c Release -o ci/CsiStub/out
      - run: dotnet build src/VXT.KetCau.Cli -c Release -p:CsiApiDir="${{ github.workspace }}\ci\CsiStub\out"

  autocad:
    name: Add-in AutoCAD + bộ cài
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Thư viện giả lập CSiAPIv1 (chỉ để biên dịch, không đóng gói)
        run: dotnet build ci/CsiStub -c Release -o ci/CsiStub/out
      - name: Build add-in AutoCAD (2022–2024 net48, 2025–2026 net8)
        run: dotnet build src/VXT.KetCau.AutoCAD -c Release -p:CsiApiDir="${{ github.workspace }}\ci\CsiStub\out"
      - name: Gom VXTKetCau.bundle
        shell: pwsh
        run: ./installer/make-bundle.ps1
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc installer\VXT.KetCau.AutoCAD.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC lỗi" }
          Compress-Archive -Path dist\VXTKetCau.bundle -DestinationPath dist\VXTKetCau.bundle.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: VXT.KetCau.AutoCAD
          path: |
            dist/*.exe
            dist/VXTKetCau.bundle.zip
      - name: Đăng bộ cài lên bản thử (nhánh phát triển)
        if: github.ref_name == 'autocad-trien-khai-ho-so'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "autocad-ho-so-thu"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --prerelease --target $env:GITHUB_SHA --title "VXT hồ sơ AutoCAD – bản thử" --notes "Bản thử từ nhánh autocad-trien-khai-ho-so." }
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          gh release upload $tag $exe.FullName dist\VXTKetCau.bundle.zip --clobber
          exit 0
      - name: Đăng bộ cài lên Releases (nhánh main)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "autocad-latest"
          gh release delete $tag -y --cleanup-tag 2>$null
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          gh release create $tag $exe.FullName dist\VXTKetCau.bundle.zip --target $env:GITHUB_SHA --title "VXT Kết cấu cho AutoCAD 2022–2026 (bản mới nhất)" --notes "Chạy file VXT.KetCau.AutoCAD-Setup-*.exe (đóng AutoCAD trước khi cài). Mở AutoCAD, gõ lệnh VXTKC. Cài tay: giải nén VXTKetCau.bundle.zip vào %AppData%\Autodesk\ApplicationPlugins. Build tự động từ commit $env:GITHUB_SHA."
