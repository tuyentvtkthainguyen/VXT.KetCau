name: Viet Const - build & test

permissions:
  contents: write

on:
  push:
  workflow_dispatch:

jobs:
  build-test:
    name: Build + kiem thu (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build toan bo (Release)
        shell: pwsh
        run: |
          dotnet build KetCauVXT.sln -c Release 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern 'error' | ForEach-Object { Write-Host "::error::$($_.Line)" }
            throw "build loi"
          }

      - name: Chay bo kiem thu + quy trinh mau
        shell: pwsh
        run: |
          dotnet run --project tests/KetCauVXT.Tests -c Release --no-build -- "$PWD\KetQuaMau" 2>&1 | Tee-Object test.log
          $code = $LASTEXITCODE
          Get-Content test.log | Where-Object { $_ -match 'FAIL|LOI|Exception' } | ForEach-Object { Write-Host "::warning::$_" }
          if ($code -ne 0) { throw "kiem thu loi ($code)" }

      - name: Kiem tra file dau ra
        shell: pwsh
        run: |
          Get-ChildItem -Recurse KetQuaMau | Format-Table FullName, Length -AutoSize | Out-String -Width 300
          $need = '*.dxf','*.docx','*.xlsx','*.e2k','*.s2k','*.kcvxt'
          foreach ($n in $need) {
            $f = Get-ChildItem -Recurse KetQuaMau -Filter $n
            if (-not $f) { throw "thieu file $n" }
            foreach ($x in $f) { if ($x.Length -lt 200) { throw "file qua nho: $($x.FullName)" } }
          }
          # docx/xlsx phai mo duoc nhu zip hop le
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          Get-ChildItem -Recurse KetQuaMau -Include *.docx,*.xlsx | ForEach-Object {
            $z = [System.IO.Compression.ZipFile]::OpenRead($_.FullName); $z.Dispose()
          }

      - name: Kiem tra DXF bang ezdxf (doc + audit doc lap)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python -m pip install --quiet ezdxf
          $py = @'
          import sys, glob, ezdxf
          from ezdxf import recover
          bad = 0
          for f in sorted(glob.glob("KetQuaMau/**/*.dxf", recursive=True)):
              if f.endswith("_DauVao.dxf"): continue   # bản vẽ kiến trúc mẫu đầu vào (R12 tối giản), không phải file chương trình xuất
              try:
                  doc, auditor = recover.readfile(f)
                  msp = doc.modelspace()
                  n = len(msp)
                  layers = sorted({e.dxf.layer for e in msp})
                  errs = len(auditor.errors)
                  print(f"{f}: {n} doi tuong, layer={layers}, loi audit={errs}")
                  if n == 0 or errs: bad += 1
              except Exception as ex:
                  print(f"{f}: KHONG DOC DUOC - {ex}"); bad += 1
          sys.exit(1 if bad else 0)
          '@
          $py | Out-File -Encoding utf8 chkdxf.py
          python chkdxf.py

      - name: Ve anh PNG ban ve Trien khai ho so (xem truoc chat luong the hien)
        shell: pwsh
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python -m pip install --quiet matplotlib
          $py = @'
          import glob, os, ezdxf
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          from ezdxf.addons.drawing import RenderContext, Frontend
          from ezdxf.addons.drawing.matplotlib import MatplotlibBackend
          os.makedirs("BanVePng", exist_ok=True)
          files = sorted(glob.glob("KetQuaMau/TrienKhai/TachRoi/*.dxf")) + sorted(glob.glob("KetQuaMau/TrienKhai/*.dxf"))
          for f in files[:30]:
              try:
                  doc = ezdxf.readfile(f)
                  fig = plt.figure(figsize=(22, 15.5))
                  ax = fig.add_axes([0, 0, 1, 1])
                  ctx = RenderContext(doc)
                  Frontend(ctx, MatplotlibBackend(ax)).draw_layout(doc.modelspace(), finalize=True)
                  out = os.path.join("BanVePng", os.path.splitext(os.path.basename(f))[0] + ".png")
                  fig.set_size_inches(36, 25.4)
                  fig.savefig(out, dpi=110, facecolor="white")
                  plt.close(fig)
                  print("ve", out)
              except Exception as ex:
                  print("loi ve", f, ex)
          '@
          $py | Out-File -Encoding utf8 vepng.py
          python vepng.py

      - name: Kiem tra thuyet minh Word bang LibreOffice (xuat PDF)
        shell: pwsh
        continue-on-error: true
        run: |
          choco install libreoffice-fresh -y --no-progress | Out-Null
          $so = "C:\Program Files\LibreOffice\program\soffice.exe"
          New-Item -ItemType Directory pdf | Out-Null
          # chỉ chuyển thuyết minh Word sang PDF (Excel đã được mở thử ở bước trước – PDF bảng nội lực rất nặng)
          Get-ChildItem -Recurse KetQuaMau -Include *.docx | ForEach-Object {
            $od = Join-Path pdf $_.Directory.Name
            & $so --headless --convert-to pdf --outdir $od $_.FullName | Out-Null
          }
          Get-ChildItem -Recurse pdf -File | Format-Table FullName, Length -AutoSize | Out-String -Width 200

      - name: Publish App (exe tu chua, khong can cai .NET)
        shell: pwsh
        run: |
          dotnet publish src/KetCauVXT.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
          Get-ChildItem publish

      # Add-in AutoCAD (KetCauVXT.AcadLink – không nằm trong .sln): build cho từng phiên bản (gói NuGet AutoCAD.NET đã xác nhận
      # có trên nuget.org: 2021 24.0.0, 2022 24.1.51000, 2023 24.2.0, 2024 24.3.0, 2025 25.0.1, 2026 25.1.0), đóng gói autoloader
      # publish\AutoCAD\KetCauVXT.bundle + script cài đặt → nằm trong file zip phát hành.
      - name: Build add-in AutoCAD 2021-2026 + dong goi KetCauVXT.bundle
        shell: pwsh
        run: |
          $vers = '2021','2022','2023','2024','2025','2026'
          $root = 'publish\AutoCAD'
          $bundle = Join-Path $root 'KetCauVXT.bundle'
          New-Item -ItemType Directory (Join-Path $bundle 'Contents') -Force | Out-Null
          foreach ($v in $vers) {
            $out = "acadout\$v"
            dotnet build src/KetCauVXT.AcadLink -c Release --no-incremental -p:AcadVersion=$v -p:UseAcadNuGet=true -o $out 2>&1 | Tee-Object "acad_$v.log"
            if ($LASTEXITCODE -ne 0) {
              Select-String -Path "acad_$v.log" -Pattern 'error' | ForEach-Object { Write-Host "::error::AutoCAD $v $($_.Line)" }
              throw "build add-in AutoCAD $v loi"
            }
            $dll = Join-Path $out 'KetCauVXT.AcadLink.dll'
            if (-not (Test-Path $dll)) { throw "thieu $dll" }
            $dst = Join-Path $bundle "Contents\$v"
            New-Item -ItemType Directory $dst -Force | Out-Null
            Copy-Item $dll $dst
            # gói chỉ chứa DLL add-in – không chép DLL của AutoCAD (acmgd/acdbmgd/accoremgd) dù có trong thư mục build
            if (Get-ChildItem $out -Filter 'ac*mgd.dll') { Write-Host "::warning::AutoCAD ${v}: thu muc build co DLL AutoCAD (khong dua vao goi)" }
          }
          Copy-Item src/KetCauVXT.AcadLink/Bundle/PackageContents.xml $bundle
          Copy-Item src/KetCauVXT.AcadLink/Bundle/CaiDatAutoCAD.ps1 $root
          Copy-Item src/KetCauVXT.AcadLink/Bundle/CaiDatAutoCAD.cmd $root
          Copy-Item docs/acad-link.md (Join-Path $root 'HuongDan_AutoCAD.md')
          [xml](Get-Content (Join-Path $bundle 'PackageContents.xml') -Raw -Encoding UTF8) | Out-Null
          Get-ChildItem -Recurse $root | Format-Table FullName, Length -AutoSize | Out-String -Width 300

      - name: Khoi dong thu giao dien
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish\KetCauVXT.exe -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          if ($p.HasExited) { throw "App thoat ngay sau khi mo, ma thoat $($p.ExitCode)" }
          Write-Host "Tieu de cua so: '$($p.MainWindowTitle)'  Responding=$($p.Responding)"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\KetQuaMau\manhinh_app.png")
          if (-not $p.Responding) { throw "App bi treo" }
          Stop-Process -Id $p.Id

      - name: Tu kiem tra giao dien (mo du an, phan tich, thiet ke, chon, sua, chup cac tab)
        shell: pwsh
        run: |
          New-Item -ItemType Directory ManHinh -Force | Out-Null
          $bad = 0
          foreach ($f in @("KetQuaMau\NhaPho\NhaPho.kcvxt", "KetQuaMau\TuBanVeKienTruc\TuBanVeKienTruc.kcvxt")) {
            $p = Start-Process -FilePath publish\KetCauVXT.exe -ArgumentList "--selftest", "`"$PWD\$f`"", "`"$PWD\ManHinh`"" -PassThru
            if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; Write-Host "::error::Tu kiem tra treo: $f"; $bad++ }
            elseif ($p.ExitCode -ne 0) { Write-Host "::error::Tu kiem tra loi ($($p.ExitCode)): $f"; $bad++ }
          }
          Get-Content ManHinh\selftest.log
          Get-ChildItem ManHinh | Format-Table Name, Length
          if ($bad -gt 0) { throw "tu kiem tra giao dien loi" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KetQuaMau
          path: |
            KetQuaMau
            pdf
            build.log
            test.log
            acad_*.log

      - uses: actions/upload-artifact@v4
        with:
          name: KetCauVXT-win-x64
          path: publish

      - name: Dong goi bo cai chuan (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (Test-Path KetQuaMau\HuongDan\HuongDanSuDung.md) { Copy-Item KetQuaMau\HuongDan\HuongDanSuDung.md publish\HuongDan.md -Force } else { Copy-Item README.md publish\HuongDan.md -Force }
          # tiếng Việt cho trình cài (bản dịch không chính thức của Inno Setup); lỗi thì dùng tiếng Anh
          try { Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Vietnamese.isl" -OutFile installer\Vietnamese.isl } catch { Write-Host "::warning::Khong tai duoc Vietnamese.isl" }
          $ver = "1.0.${{ github.run_number }}"
          & $iscc /Qp "/DAppVer=$ver" installer\KetCauVXT.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Bien dich voi tieng Viet loi – thu lai chi tieng Anh"
            Remove-Item installer\Vietnamese.isl -ErrorAction SilentlyContinue
            & $iscc /Qp "/DAppVer=$ver" installer\KetCauVXT.iss
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup loi" }
          }
          Get-ChildItem dist\setup | Format-Table Name, Length
          # thử cài im lặng + gỡ để chắc bộ cài chạy được
          $p = Start-Process dist\setup\VietConst-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/LOG=setup_test.log" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content setup_test.log -Tail 40; throw "Cai thu loi ($($p.ExitCode))" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\KetCauVXT\KetCauVXT.exe"
          if (-not (Test-Path $exe)) { Get-Content setup_test.log -Tail 40; throw "Khong thay $exe sau khi cai" }
          Write-Host "Da cai thu: $exe"
          $un = Get-ChildItem (Split-Path $exe) -Filter "unins*.exe" | Select-Object -First 1
          $p = Start-Process $un.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          Write-Host "Go cai thu: ma $($p.ExitCode)"

      - name: Dang file exe len Releases + nhanh ketcau-vxt-dist
        if: github.ref == 'refs/heads/ketcau-vxt'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory dist -Force | Out-Null
          if (Test-Path KetQuaMau\HuongDan\HuongDanSuDung.md) { Copy-Item KetQuaMau\HuongDan\HuongDanSuDung.md publish\HuongDan.md -Force } else { Copy-Item README.md publish\HuongDan.md -Force }
          Compress-Archive -Path publish\* -DestinationPath dist\KetCauVXT-win-x64.zip -Force
          Get-ChildItem dist
          $tag = "ketcau-vxt-latest"
          gh release delete $tag -y --cleanup-tag 2>$null
          $assets = @("dist\KetCauVXT-win-x64.zip") + (Get-ChildItem dist\setup -File | ForEach-Object { $_.FullName })
          gh release create $tag @assets --target $env:GITHUB_SHA --title "Việt Const – bản Windows mới nhất" --notes "Bộ cài chuẩn: tải VietConst-Setup.exe và tất cả file VietConst-Setup-*.bin về cùng một thư mục, chạy VietConst-Setup.exe. Bản không cần cài: giải nén KetCauVXT-win-x64.zip, chạy KetCauVXT.exe (Windows 10/11 64-bit, không cần cài .NET). Add-in AutoCAD 2021–2026 (tích chọn tường, cột, dầm, sàn, trục gửi sang chương trình): chạy AutoCAD\CaiDatAutoCAD.cmd. Build tự động từ commit $env:GITHUB_SHA, đã qua toàn bộ kiểm thử."
          # nhánh chỉ chứa file phát hành (để tải bằng git)
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan ketcau-vxt-dist
          git rm -rf --cached . | Out-Null
          git add -f dist/KetCauVXT-win-x64.zip
          if (Test-Path dist/setup) { git add -f dist/setup/* }
          if (Test-Path KetQuaMau/KiemChung) { git add -f KetQuaMau/KiemChung/* }
          if (Test-Path KetQuaMau/HuongDan) { git add -f KetQuaMau/HuongDan/* }
          if (Test-Path ManHinh) { git add -f ManHinh/*.png ManHinh/selftest.log }
          if (Test-Path BanVePng) { git add -f BanVePng/*.png }
          git commit -m "Ban phat hanh tu $env:GITHUB_SHA"
          git push -f origin ketcau-vxt-dist

  revit:
    name: Add-in Revit ${{ matrix.rv }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rv: [2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build add-in
        run: dotnet build src/KetCauVXT.RevitExport -c Release -p:RevitVersion=${{ matrix.rv }} -o out
      - uses: actions/upload-artifact@v4
        with:
          name: KetCauVXT.RevitExport-${{ matrix.rv }}
          path: out
